name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python-version }})
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package
        run: python -m pip install -e .
      - name: Check installed dependencies
        run: python -m pip check
      - name: Compile
        run: python -m compileall -q src tests scripts
      - name: Test
        run: python -m unittest discover -s tests -v
      - name: Demo
        env:
          SOURCE_DATE_EPOCH: "1785960000"
        run: python -m evalcanary demo --out evalcanary-demo
      - name: Upload canonical demo report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always() && matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        with:
          name: evalcanary-demo-report
          path: evalcanary-demo/report
          if-no-files-found: error
          retention-days: 14

  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package and development tools
        run: python -m pip install -e ".[dev]"
      - name: Ruff
        run: ruff check .
      - name: Mypy
        run: mypy
      - name: Pytest
        run: pytest
      - name: Build distributions
        run: python -m build
      - name: Verify clean wheel installation
        env:
          SOURCE_DATE_EPOCH: "1785960000"
        run: |
          python - <<'PY'
          from __future__ import annotations

          import json
          import os
          import subprocess
          import venv
          from pathlib import Path

          wheels = sorted(Path("dist").glob("*.whl"))
          sdists = sorted(Path("dist").glob("*.tar.gz"))
          if len(wheels) != 1 or len(sdists) != 1:
              raise SystemExit(
                  f"Expected one wheel and one sdist; found {wheels!r} and {sdists!r}."
              )

          root = Path(".wheel-smoke")
          venv.create(root, with_pip=True, clear=True)
          python = root / "bin" / "python"
          subprocess.run(
              [str(python), "-m", "pip", "install", "--no-deps", str(wheels[0])],
              check=True,
          )
          target = Path("wheel-smoke-demo")
          env = os.environ.copy()
          subprocess.run(
              [str(python), "-m", "evalcanary", "demo", "--out", str(target)],
              check=True,
              env=env,
          )
          payload = json.loads(
              (target / "report" / "report.json").read_text(encoding="utf-8")
          )
          if payload["transition_counts"]["fail_to_pass"] != 5:
              raise SystemExit("Installed-wheel demo contract failed.")
          PY

  action-smoke:
    name: action-smoke (${{ matrix.os }})
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Run the repository action
        id: evalcanary
        uses: ./
        env:
          SOURCE_DATE_EPOCH: "1785960000"
        with:
          data: examples/exact_match/cases.jsonl
          before: examples/exact_match/verifier_before.py
          after: examples/exact_match/verifier_after.py
          policy: examples/exact_match/evalcanary.toml
          slice: metadata.domain
          output: action-smoke-report
      - name: Verify action outputs and report contract
        shell: python
        env:
          REPORT_DIRECTORY: ${{ steps.evalcanary.outputs.report_directory }}
          REPORT_JSON: ${{ steps.evalcanary.outputs.report_json }}
          REPORT_MARKDOWN: ${{ steps.evalcanary.outputs.report_markdown }}
          REPORT_HTML: ${{ steps.evalcanary.outputs.report_html }}
          RUN_ID: ${{ steps.evalcanary.outputs.run_id }}
          CHANGED_CASES: ${{ steps.evalcanary.outputs.changed_cases }}
          POLICY_PASSED: ${{ steps.evalcanary.outputs.policy_passed }}
        run: |
          from __future__ import annotations

          import json
          import os
          from pathlib import Path

          paths = {
              "directory": Path(os.environ["REPORT_DIRECTORY"]),
              "json": Path(os.environ["REPORT_JSON"]),
              "markdown": Path(os.environ["REPORT_MARKDOWN"]),
              "html": Path(os.environ["REPORT_HTML"]),
          }
          for label, path in paths.items():
              if not path.exists():
                  raise SystemExit(f"Missing {label} action output: {path}")
          payload = json.loads(paths["json"].read_text(encoding="utf-8"))
          if payload["run_id"] != os.environ["RUN_ID"]:
              raise SystemExit("Action run_id output does not match report.json.")
          if os.environ["CHANGED_CASES"] != "5":
              raise SystemExit("Action changed_cases output was not 5.")
          if os.environ["POLICY_PASSED"] != "true":
              raise SystemExit("Action policy_passed output was not true.")
      - name: Create a deliberately blocking policy
        if: matrix.os == 'ubuntu-latest'
        shell: python
        run: |
          from pathlib import Path

          Path("strict-action-policy.toml").write_text(
              "[policy]\nmax_fail_to_pass = 0\n",
              encoding="utf-8",
          )
      - name: Exercise policy-failure semantics
        if: matrix.os == 'ubuntu-latest'
        id: blocked
        continue-on-error: true
        uses: ./
        env:
          SOURCE_DATE_EPOCH: "1785960000"
        with:
          data: examples/exact_match/cases.jsonl
          before: examples/exact_match/verifier_before.py
          after: examples/exact_match/verifier_after.py
          policy: strict-action-policy.toml
          output: action-blocked-report
      - name: Verify policy-failure outputs
        if: matrix.os == 'ubuntu-latest'
        shell: python
        env:
          STEP_OUTCOME: ${{ steps.blocked.outcome }}
          REPORT_JSON: ${{ steps.blocked.outputs.report_json }}
          POLICY_PASSED: ${{ steps.blocked.outputs.policy_passed }}
        run: |
          import json
          import os
          from pathlib import Path

          if os.environ["STEP_OUTCOME"] != "failure":
              raise SystemExit("Blocking policy did not fail the action step.")
          if os.environ["POLICY_PASSED"] != "false":
              raise SystemExit("Blocking policy output was not false.")
          report = Path(os.environ["REPORT_JSON"])
          payload = json.loads(report.read_text(encoding="utf-8"))
          if payload["policy"]["passed"] is not False:
              raise SystemExit("Blocking report did not record a failed policy.")

  release-gate:
    name: release-gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - run: python scripts/release_check.py
      - run: python scripts/check_ascii_ps.py

  ci-gate:
    name: ci-gate
    if: always()
    needs: [test, quality, action-smoke, release-gate]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify all required CI jobs
        env:
          TEST_RESULT: ${{ needs.test.result }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          ACTION_SMOKE_RESULT: ${{ needs.action-smoke.result }}
          RELEASE_GATE_RESULT: ${{ needs.release-gate.result }}
        run: |
          printf 'test: %s\n' "$TEST_RESULT"
          printf 'quality: %s\n' "$QUALITY_RESULT"
          printf 'action-smoke: %s\n' "$ACTION_SMOKE_RESULT"
          printf 'release-gate: %s\n' "$RELEASE_GATE_RESULT"
          test "$TEST_RESULT" = success
          test "$QUALITY_RESULT" = success
          test "$ACTION_SMOKE_RESULT" = success
          test "$RELEASE_GATE_RESULT" = success
