name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package
        run: python -m pip install -e .
      - name: Compile
        run: python -m compileall -q src tests scripts
      - name: Test
        run: python -m unittest discover -s tests -v
      - name: Demo
        env:
          SOURCE_DATE_EPOCH: "1785960000"
        run: python -m evalcanary demo --out evalcanary-demo
      - uses: actions/upload-artifact@v4
        if: always() && matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        with:
          name: evalcanary-demo-report
          path: evalcanary-demo/report

  release-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: python scripts/release_check.py
      - run: python scripts/check_ascii_ps.py
