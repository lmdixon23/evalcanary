# THIS IS AUTOGENERATED. DO NOT EDIT MANUALLY
version = 1
name = "EvalCanary development - Windows"

[setup]
script = ""

[setup.win32]
script = '''
$ErrorActionPreference = "Stop"

$required = @(
    ".\pyproject.toml",
    ".\README.md",
    ".\CONTRIBUTING.md",
    ".\scripts\release_check.py",
    ".\scripts\check_ascii_ps.py",
    ".\scripts\Test-EvalCanary-Windows.ps1",
    ".\src\evalcanary",
    ".\tests"
)

foreach ($path in $required) {
    if (-not (Test-Path -LiteralPath $path)) {
        throw "This does not appear to be the EvalCanary project root. Missing: $path"
    }
}

$pyproject = Get-Content ".\pyproject.toml" -Raw

if ($pyproject -notmatch '(?m)^name\s*=\s*"evalcanary"\s*$') {
    throw "pyproject.toml does not identify this repository as EvalCanary."
}

$root = (Get-Location).Path
$venv = Join-Path $root ".venv"
$python = Join-Path $venv "Scripts\python.exe"

if (-not (Test-Path -LiteralPath $python -PathType Leaf)) {
    py -3.12 -m venv $venv

    if ($LASTEXITCODE -ne 0) {
        exit $LASTEXITCODE
    }
}

$pythonVersion = (& $python -c "import sys; print(f'{sys.version_info.major}.{sys.version_info.minor}')").Trim()

if ($LASTEXITCODE -ne 0) {
    throw "Unable to determine the EvalCanary virtual-environment Python version."
}

$supportedVersions = @(
    "3.11",
    "3.12",
    "3.13",
    "3.14"
)

if ($pythonVersion -notin $supportedVersions) {
    throw "Unsupported EvalCanary Python version in .venv: $pythonVersion"
}

& $python -m pip install --disable-pip-version-check -e ".[dev]"

if ($LASTEXITCODE -ne 0) {
    exit $LASTEXITCODE
}

& $python -m pip check

if ($LASTEXITCODE -ne 0) {
    exit $LASTEXITCODE
}

& $python -c "import evalcanary; print('EvalCanary environment ready:', evalcanary.__version__)"

if ($LASTEXITCODE -ne 0) {
    exit $LASTEXITCODE
}

exit 0'''

[[actions]]
name = "Fast checks"
icon = "tool"
command = '''
$ErrorActionPreference = "Stop"

$root = (Get-Location).Path
$python = Join-Path $root ".venv\Scripts\python.exe"

if (-not (Test-Path -LiteralPath $python -PathType Leaf)) {
    throw "EvalCanary development environment is not initialized."
}

Write-Host ""
Write-Host "=== RUFF ==="

& $python -m ruff check .

if ($LASTEXITCODE -ne 0) {
    exit $LASTEXITCODE
}

Write-Host ""
Write-Host "=== MYPY ==="

& $python -m mypy

if ($LASTEXITCODE -ne 0) {
    exit $LASTEXITCODE
}

Write-Host ""
Write-Host "=== PYTEST ==="

& $python -m pytest

if ($LASTEXITCODE -ne 0) {
    exit $LASTEXITCODE
}

Write-Host ""
Write-Host "EVALCANARY FAST CHECKS PASSED"

exit 0'''
platform = "win32"

[[actions]]
name = "Release check"
icon = "tool"
command = '''
$ErrorActionPreference = "Stop"

$root = (Get-Location).Path
$python = Join-Path $root ".venv\Scripts\python.exe"

if (-not (Test-Path -LiteralPath $python -PathType Leaf)) {
    throw "EvalCanary development environment is not initialized."
}

Write-Host ""
Write-Host "=== RELEASE CHECK ==="

& $python .\scripts\release_check.py

if ($LASTEXITCODE -ne 0) {
    exit $LASTEXITCODE
}

Write-Host ""
Write-Host "=== POWERSHELL ASCII CHECK ==="

& $python .\scripts\check_ascii_ps.py

if ($LASTEXITCODE -ne 0) {
    exit $LASTEXITCODE
}

Write-Host ""
Write-Host "EVALCANARY RELEASE CHECK PASSED"

exit 0'''
platform = "win32"

[[actions]]
name = "Windows verification"
icon = "tool"
command = '''
$ErrorActionPreference = "Stop"

$root = (Get-Location).Path
$python = Join-Path $root ".venv\Scripts\python.exe"

if (-not (Test-Path -LiteralPath $python -PathType Leaf)) {
    throw "EvalCanary development environment is not initialized."
}

$verificationScript = Join-Path $root "scripts\Test-EvalCanary-Windows.ps1"

if (-not (Test-Path -LiteralPath $verificationScript -PathType Leaf)) {
    throw "Missing EvalCanary Windows verification script."
}

Write-Host ""
Write-Host "=== WINDOWS VERIFICATION ==="

& $verificationScript -ProjectRoot $root

if ($LASTEXITCODE -ne 0) {
    exit $LASTEXITCODE
}

Write-Host ""
Write-Host "EVALCANARY WINDOWS VERIFICATION PASSED"

exit 0'''
platform = "win32"

[[actions]]
name = "Full Windows dev gate"
icon = "tool"
command = '''
$ErrorActionPreference = "Stop"

$root = (Get-Location).Path
$python = Join-Path $root ".venv\Scripts\python.exe"

if (-not (Test-Path -LiteralPath $python -PathType Leaf)) {
    throw "EvalCanary development environment is not initialized."
}

Write-Host ""
Write-Host "=== PIP CHECK ==="

& $python -m pip check

if ($LASTEXITCODE -ne 0) {
    exit $LASTEXITCODE
}

Write-Host ""
Write-Host "=== RUFF ==="

& $python -m ruff check .

if ($LASTEXITCODE -ne 0) {
    exit $LASTEXITCODE
}

Write-Host ""
Write-Host "=== MYPY ==="

& $python -m mypy

if ($LASTEXITCODE -ne 0) {
    exit $LASTEXITCODE
}

Write-Host ""
Write-Host "=== PYTEST ==="

& $python -m pytest

if ($LASTEXITCODE -ne 0) {
    exit $LASTEXITCODE
}

Write-Host ""
Write-Host "=== CLEAN BUILD OUTPUT ==="

$buildPath = Join-Path $root "build"
$distPath = Join-Path $root "dist"

if (Test-Path -LiteralPath $buildPath) {
    Remove-Item -LiteralPath $buildPath -Recurse -Force
}

if (Test-Path -LiteralPath $distPath) {
    Remove-Item -LiteralPath $distPath -Recurse -Force
}

Write-Host ""
Write-Host "=== BUILD DISTRIBUTIONS ==="

& $python -m build

if ($LASTEXITCODE -ne 0) {
    exit $LASTEXITCODE
}

Write-Host ""
Write-Host "=== RELEASE CHECK ==="

& $python .\scripts\release_check.py

if ($LASTEXITCODE -ne 0) {
    exit $LASTEXITCODE
}

Write-Host ""
Write-Host "=== POWERSHELL ASCII CHECK ==="

& $python .\scripts\check_ascii_ps.py

if ($LASTEXITCODE -ne 0) {
    exit $LASTEXITCODE
}

Write-Host ""
Write-Host "=== WINDOWS NATIVE VERIFICATION ==="

& .\scripts\Test-EvalCanary-Windows.ps1 -ProjectRoot $root

if ($LASTEXITCODE -ne 0) {
    exit $LASTEXITCODE
}

Write-Host ""
Write-Host "=== FINAL GIT STATUS ==="

$status = @(& git status --short --untracked-files=all)

if ($LASTEXITCODE -ne 0) {
    throw "Unable to read final Git status."
}

if ($status.Count -ne 0) {
    Write-Host "Nonignored working-tree changes remain:"
    $status | ForEach-Object { Write-Host $_ }
    throw "Full Windows development gate left the tracked/nonignored working tree dirty."
}

Write-Host "Working tree: CLEAN"
Write-Host ""
Write-Host "EVALCANARY FULL WINDOWS DEV GATE PASSED"

exit 0'''
platform = "win32"
